<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codazc - Premium Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hides arrows on number inputs to keep the card fields looking clean */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="w-full max-w-5xl bg-white rounded-[2rem] shadow-[0_20px_60px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col lg:flex-row min-h-[600px]">
        
        <div class="hidden lg:flex flex-col items-center py-8 w-20 border-r border-gray-100 bg-white z-10">
            <a href="courses.html" class="w-10 h-10 bg-indigo-900 text-white rounded-full flex items-center justify-center font-bold text-sm mb-10 hover:bg-indigo-800 transition-colors">
                &larr;
            </a>
            <div class="flex flex-col gap-8 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-indigo-600"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
            </div>
        </div>

        <div class="flex-1 p-8 md:p-12 flex flex-col">
            
            <div class="flex items-center gap-4 mb-8">
                <div class="w-3 h-3 bg-indigo-600 rounded-full"></div>
                <div>
                    <p class="text-xs text-indigo-600 font-bold uppercase tracking-wider mb-1">Step 01</p>
                    <h2 class="text-3xl font-black text-[#1c1c28]">Enrollment</h2>
                </div>
            </div>

            <form id="premiumForm" class="flex-grow flex flex-col">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">First Name</label>
                        <input type="text" required placeholder="John" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">Last Name</label>
                        <input type="text" required placeholder="Doe" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">Email</label>
                    <input type="email" required placeholder="john@example.com" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
                </div>

                <div class="mb-4 mt-6">
                    <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">Card Number (No alphabets)</label>
                    <input type="number" required placeholder="0000 0000 0000 0000" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500 tracking-widest font-mono">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">Expiry Date</label>
                        <input type="text" required placeholder="MM/YY" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-2">CVV</label>
                        <input type="number" required placeholder="123" class="w-full bg-gray-50/50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500 font-mono">
                    </div>
                </div>

                <button type="submit" id="hiddenSubmit" class="hidden"></button>
            </form>
            
            <div class="mt-8 space-y-4 border-l border-gray-200 ml-1.5 pl-6 pb-2">
                <div>
                    <p class="text-xs text-gray-400 font-semibold mb-1">Step 02</p>
                    <h3 class="text-lg font-bold text-gray-400">Review Identity</h3>
                </div>
            </div>
        </div>

        <div class="lg:w-[350px] bg-gray-50/50 p-8 flex flex-col">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 h-full flex flex-col">
                <h3 class="text-xl font-bold text-[#1c1c28] mb-6">Summary</h3>
                
                <div class="flex items-center gap-4 mb-4 pb-4 border-b border-gray-50">
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-500 font-bold">PRO</div>
                    <div class="flex-1">
                        <p class="text-xs text-gray-400 font-semibold">Premium Track</p>
                        <p class="text-sm font-bold text-gray-800 line-clamp-1">AI & Machine Learning</p>
                    </div>
                    <div class="text-sm font-bold text-gray-900">₹600</div>
                </div>

                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-50">
                    <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-500 font-bold">CRT</div>
                    <div class="flex-1">
                        <p class="text-xs text-gray-400 font-semibold">Add-on</p>
                        <p class="text-sm font-bold text-gray-800">Official Certificate</p>
                    </div>
                    <div class="text-sm font-bold text-gray-900">₹0</div>
                </div>

                <div class="mt-auto pt-4 flex items-center justify-between mb-6">
                    <span class="text-gray-500 font-semibold">Total</span>
                    <span class="text-2xl font-black text-indigo-600">₹600</span>
                </div>

                <button type="button" id="payBtn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all hover:-translate-y-1 uppercase tracking-wider text-sm">
                    Save & Continue
                </button>
            </div>
        </div>

    </div>

    <div id="successPopup" class="fixed inset-0 bg-[#05050A]/90 z-[2000] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-md">
        <div class="bg-gradient-to-b from-indigo-900 to-black p-[2px] rounded-3xl shadow-2xl shadow-indigo-500/20 transform scale-90 transition-transform duration-300" id="popupCard">
            <div class="bg-[#111] rounded-3xl p-8 max-w-sm text-center">
                <div class="w-20 h-20 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border border-indigo-500/30">
                    💎
                </div>
                <h2 class="text-2xl font-black text-white mb-2">Secured the Bag!</h2>
                <p class="text-gray-400 text-sm mb-6">Payment verified. Premium access unlocked. Big W, no cap. Let's start engineering.</p>
                <a href="workspace.html" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-colors shadow-[0_0_15px_rgba(79,70,229,0.4)]">
                    Enter Workspace ⚡
                </a>
            </div>
        </div>
    </div>

    <script>
        // Form submission logic
        const form = document.getElementById('premiumForm');
        const payBtn = document.getElementById('payBtn');
        const popup = document.getElementById('successPopup');
        const popupCard = document.getElementById('popupCard');

        // Allow the "Save & Continue" button to trigger the form
        payBtn.addEventListener('click', function() {
            // Check if form is valid before showing success
            if (form.reportValidity()) {
                showSuccess();
            }
        });

        // Also handle the natural 'submit' event (e.g. if they press enter in a field)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            showSuccess();
        });

        function showSuccess() {
            popup.classList.remove('opacity-0', 'pointer-events-none');
            popupCard.classList.remove('scale-90');
            popupCard.classList.add('scale-100');
        }
    </script>
</body>
</html>
